prerender_custom:
  server:
    port: 8081
    root: ./tests/example_dist/simple
    handler:
      options:
        pid: /tmp/.server-test/spa_nginx.pid
        config: /tmp/.server-test/generated_nginx_custom.conf
    prerender:
      enabled: true
      cdnUrl: "https://cdn.example.com"
      setup: |-
        set $req_uri $uri;
        set $suffix "/index";
        if ($req_uri = /) {
          set $req_uri "/index";
          set $suffix "";
        }
        if ($args ~ "variation=([^&]*)(?=&)*") {
          set $suffix "/variation=$1";
        }
      rewrite: '/prerender$req_uri$suffix'
    logger:
      enabled: false
